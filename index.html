<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adobe Stock Prompt Tool - Human Actor + 3D X-Ray Anatomy Edition</title>
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: #111a2e;
            --card-border: #1e2d4a;
            --accent: #00e5ff;
            --accent-gradient: linear-gradient(135deg, #00e5ff, #ec4899);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --success: #10b981;
            --flow-color: #10b981;
            --mj-color: #a855f7;
            --ff-color: #ff4343;
            --xray-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 8px;
        }

        select, input[type="number"] {
            width: 100%;
            background: #060a14;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        .btn-generate {
            width: 100%;
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.25);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-generate:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prompt-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .card-num {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
        }

        .badge-bestseller {
            background: rgba(236, 72, 153, 0.15);
            color: var(--xray-pink);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .section-tag {
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tag-flow { color: var(--flow-color); }
        .tag-mj { color: var(--mj-color); }
        .tag-ff { color: var(--ff-color); }
        .tag-meta { color: #f59e0b; }

        .text-box {
            background: #060a14;
            border: 1px solid #16233d;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #cbd5e1;
            word-break: break-word;
            margin-bottom: 8px;
            user-select: all;
        }

        .btn-copy {
            width: 100%;
            background: #182238;
            color: #e2e8f0;
            border: 1px solid #283754;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-copy:active {
            background: #283754;
            transform: scale(0.98);
        }

        .btn-copy.copied {
            background: var(--success) !important;
            color: #fff !important;
            border-color: var(--success) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>👤 ACTOR + 3D X-RAY ANATOMY</h1>
        <p>Real Human Model + Translucent Medical X-Ray Overlay</p>
    </div>

    <div class="control-panel">
        <div class="form-group">
            <label for="categorySelect">Pilih Skenario Aktor & Anatomi</label>
            <select id="categorySelect">
                <option value="1">🏃 Athlete & Runner Knee/Joint Pain</option>
                <option value="2">💻 Office Worker Lower Back & Neck Pain</option>
                <option value="3">👵 Elderly Person Hip & Joint Arthritis</option>
                <option value="4">🤯 Person Holding Head (Migraine & Stress)</option>
                <option value="5">🫀 Patient Holding Chest (Heart Attack Pain)</option>
                <option value="6">🩺 Doctor Examining Holographic 3D Patient Body</option>
            </select>
        </div>

        <div class="form-group">
            <label for="countInput">Jumlah Prompt Variasi</label>
            <input type="number" id="countInput" value="5" min="1" max="20">
        </div>

        <button class="btn-generate" onclick="generatePrompts()">🚀 Generate Prompts & Metadata</button>
    </div>

    <div id="results" class="results-container"></div>
</div>

<script>
const CATEGORIES = {
    "1": {
        name: "Athlete Knee & Joint Injury",
        actor: "realistic professional male runner athlete sitting on athletic track touching his knee in pain",
        xray: "translucent 3D glowing x-ray knee joint overlay showing red arthritis inflammation and patella bone structure",
        setting: "sports stadium background, dark athletic dramatic lighting",
        titles: ["Athlete Holding Injured Knee with 3D X-Ray Joint Inflammation Overlay", "Sports Injury Concept Male Runner Touching Knee with Glowing Joint X-Ray", "Translucent Knee Joint Pain X-Ray Scan on Male Athlete"],
        tags: "athlete, sports injury, knee pain, joint, xray, x-ray, runner, inflammation, medical, 3d render, overlay, anatomy, arthritis, healthcare, pain, runner, fitness, orthopedics, copy space"
    },
    "2": {
        name: "Office Worker Back & Neck Ergonomics",
        actor: "realistic office worker sitting at modern desk touching his painful lower back and neck",
        xray: "glowing translucent 3D spinal column x-ray overlay highlighting severe lumbar vertebrae inflammation spot in bright red",
        setting: "dark modern minimalist office studio setting with moody lighting",
        titles: ["Office Worker with Lower Back Pain Showing 3D Spine X-Ray Overlay", "Ergonomics and Backache Concept Worker Touching Spinal Spine Inflammation", "Translucent Lumbar Spine X-Ray Scan Overlay on Sitting Man"],
        tags: "back pain, office worker, spine, lumbar, posture, ergonomics, xray, x-ray, anatomy, 3d render, overlay, medical, healthcare, inflammation, backbone, ache, strain, corporate, copy space"
    },
    "3": {
        name: "Elderly Person Joint & Hip Care",
        actor: "realistic elderly person standing with walking cane touching hip joint in discomfort",
        xray: "translucent glowing cyan 3D hip joint and pelvis skeleton x-ray overlay with red arthritis pain highlight",
        setting: "clean studio background with dramatic soft rim lighting",
        titles: ["Elderly Person Holding Hip with 3D Translucent Joint Arthritis X-Ray Overlay", "Senior Healthcare Concept Hip Joint Pain and Osteoporosis X-Ray Scan", "Translucent Pelvis and Hip Joint Inflammation X-Ray on Elderly Patient"],
        tags: "elderly, senior, hip pain, arthritis, osteoporosis, joint, xray, x-ray, healthcare, medical, anatomy, 3d render, overlay, pelvis, bone, patient, old age, orthopedics, copy space"
    },
    "4": {
        name: "Headache & Migraine Stress Scan",
        actor: "realistic person rubbing temples in severe pain and stress",
        xray: "translucent 3D glowing head skull and brain scan overlay with electric neural impulse activity and red migraine pain center",
        setting: "dark atmospheric cinematic lighting with subtle blue tint",
        titles: ["Person Touching Head with 3D Brain Scan Migraine Inflammation Overlay", "Stress and Headache Medical Concept Brain Neural Activity Head X-Ray", "Translucent Head Skull and Brain X-Ray Scan on Person in Pain"],
        tags: "headache, migraine, brain, stress, neurology, head, xray, x-ray, skull, neural, anatomy, 3d render, overlay, medical, healthcare, mind, pain, mental health, copy space"
    },
    "5": {
        name: "Cardiology Heart Attack Chest Pain",
        actor: "realistic person holding chest in acute heart pain discomfort",
        xray: "translucent 3D glowing human heart and coronary artery blood vessels overlay glowing intensely inside chest ribcage",
        setting: "dramatic moody dark background with focused spotlight",
        titles: ["Person Holding Chest with 3D Glowing Heart and Coronary Artery X-Ray Overlay", "Heart Attack and Cardiovascular Disease Medical Concept Patient Chest Pain", "Translucent Heart and Circulatory System X-Ray Scan Overlay on Man"],
        tags: "heart pain, heart attack, chest pain, cardiology, cardiovascular, blood vessel, xray, x-ray, organ, medical, anatomy, 3d render, overlay, healthcare, disease, pulse, patient, copy space"
    },
    "6": {
        name: "Doctor & Futuristic Diagnostic Hologram",
        actor: "realistic professional medical doctor examining a full body translucent human anatomy hologram",
        xray: "3D holographic glowing skeleton, circulatory system, and neural HUD diagnostics floating in air",
        setting: "futuristic high-tech medical laboratory background with cyan ambient lighting",
        titles: ["Medical Doctor Examining Futuristic 3D Human Anatomy Hologram Scan", "Digital Healthcare Technology Doctor Analyzing Translucent Body Diagnostics", "3D Holographic Full Body Medical Scan with Doctor in Modern Clinic"],
        tags: "doctor, medical technology, hologram, full body, anatomy, diagnostic, futuristic, healthcare, 3d render, xray, scan, digital health, clinic, physician, science, hud, copy space"
    }
};

const LIGHTINGS = [
    "cinematic dramatic side lighting with vivid translucent x-ray glow",
    "soft studio spotlight highlighting the real person with bright glowing 3D anatomical layer",
    "atmospheric dark blue background lighting with glowing red pain focal point"
];

const COMPOSITIONS = [
    "medium shot with clean dark copy space on the side for headline text",
    "uncluttered wide composition centered on the subject with negative space",
    "clean cinematic profile angle with smooth dark backdrop"
];

function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generatePrompts() {
    const catId = document.getElementById("categorySelect").value;
    const count = parseInt(document.getElementById("countInput").value) || 5;
    const cat = CATEGORIES[catId];
    const resultsDiv = document.getElementById("results");
    
    resultsDiv.innerHTML = "";

    for (let i = 1; i <= count; i++) {
        const lighting = getRandom(LIGHTINGS);
        const composition = getRandom(COMPOSITIONS);

        // FLOW Prompt Format
        const flowPrompt = `Photorealistic photo of a ${cat.actor}, integrated with an inner ${cat.xray}, ${cat.setting}, ${composition}, ${lighting}, high anatomical clarity, medical stock photography, 8k resolution, clean dark background, no text, no watermark`;
        
        // Midjourney Format
        const mjPrompt = `/imagine prompt: High quality photo of ${cat.actor}, blended with translucent inner ${cat.xray}, ${cat.setting}, ${composition}, ${lighting}, medical stock imagery --ar 16:9 --style raw --v 6.0`;
        
        // Firefly Format
        const ffPrompt = `Photo of ${cat.actor}, inner translucent ${cat.xray}, ${cat.setting}, ${composition}, ${lighting}, medical illustration overlay, clean dark background`;
        
        const title = `${cat.titles[(i-1) % cat.titles.length]} - Option ${i}`;

        const card = document.createElement("div");
        card.className = "prompt-card";
        card.innerHTML = `
            <div class="card-header">
                <span class="card-num">📌 Option #${i}</span>
                <span class="badge-bestseller">ACTOR + X-RAY OVERLAY</span>
            </div>

            <div class="section-tag tag-flow"><span>🌊</span> FLOW Prompt</div>
            <div class="text-box" id="flow_${i}">${flowPrompt}</div>
            <button class="btn-copy" onclick="copyText('flow_${i}', this)">📋 Copy Prompt FLOW</button>

            <div class="section-tag tag-mj"><span>🔮</span> Midjourney v6</div>
            <div class="text-box" id="mj_${i}">${mjPrompt}</div>
            <button class="btn-copy" onclick="copyText('mj_${i}', this)">📋 Copy Midjourney</button>

            <div class="section-tag tag-ff"><span>🔥</span> Adobe Firefly</div>
            <div class="text-box" id="ff_${i}">${ffPrompt}</div>
            <button class="btn-copy" onclick="copyText('ff_${i}', this)">📋 Copy Firefly</button>

            <div class="section-tag tag-meta"><span>🏷️</span> Judul SEO Adobe Stock</div>
            <div class="text-box" id="title_${i}">${title}</div>
            <button class="btn-copy" onclick="copyText('title_${i}', this)">📋 Copy Judul SEO</button>

            <div class="section-tag tag-meta"><span>🔑</span> Keywords / Tags (25+)</div>
            <div class="text-box" id="tags_${i}">${cat.tags}</div>
            <button class="btn-copy" onclick="copyText('tags_${i}', this)">📋 Copy 25+ Tags</button>
        `;
        resultsDiv.appendChild(card);
    }
}

function copyText(id, btn) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Copied to Clipboard!";
        btn.classList.add("copied");
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove("copied");
        }, 1500);
    }).catch(err => {
        alert("Gagal menyalin: " + err);
    });
}

// Initial Run
generatePrompts();
</script>

</body>
</html>
